<body>

<h1>Nヤンのポートフォリオ</h1>
<p>Excelで業務改善・効率化を目指しています</p>

<section>

<div class="card">
<h2>自己紹介</h2>

<p>
Excel・VBA・関数を学習しながら、
実務で役立つ管理システムの制作に取り組んでいます。
</p>

</div>

<div class="card">

<ul>
<li>MOS Excel Associate</li>

    複数のペットのお世話状況を記録・管理するためにExcelで制作しました。

  </p>

  <p><strong>主な機能：</strong>
    個体情報管理・飼育記録・カレンダー表示・推移グラフ
  </p>
